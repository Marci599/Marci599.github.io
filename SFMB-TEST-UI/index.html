function twn(o,k,target,now){const s=o['_'+k]||(o['_'+k]={from:o[k],to:target,t0:now});if(s.to!==target){s.from=o[k];s.to=target;s.t0=now}const t=Math.min(1,(now-s.t0)/300);const e=s.to<s.from?t*t*t:1-Math.pow(1-t,3);return s.from+(s.to-s.from)*e}
function frame(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 for(const u of U){
  u.x+=u.vx*dt;u.y+=u.vy*dt;
  if(u.x<u.R){u.x=u.R;u.vx=Math.abs(u.vx)}

 }
 for(let i=0;i<U.length;i++)for(let j=i+1;j<U.length;j++){

 }

 for(const u of U){

 else if(v==='users'||v==='users-list'||(m=/^(profile|list)-(.+)$/.exec(v))){
  target='gal';if(v==='users-list')listOn=true;
  if(m){idx=U.findIndex(u=>u.slug===m[2]);if(idx>=0){listOn=m[1]==='list';prof=m[1]==='profile'}}

}
